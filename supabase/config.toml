# Configurazione Supabase di My Fiscal (vedi specs/002-accesso-protetto-2fa/research.md).
# Nessun segreto qui: il file è nel repository pubblico.
project_id = "my-fiscal"

[api]
enabled = true
schemas = ["public"]            # lo schema "private" NON è esposto dall'API
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "https://fiscal.soarlyai.com"
additional_redirect_urls = []
jwt_expiry = 900                         # 15 minuti (D-09)
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                    # un solo utente: nessuna registrazione (D-05)
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

# Limiti di tentativi (FR-012), per indirizzo IP ogni 5 minuti: password, codici a 6 cifre, rinnovi.
[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
# Il login con e-mail e password resta attivo; le registrazioni sono bloccate da [auth] enable_signup.
enabled = true
double_confirm_changes = true
enable_confirmations = true

# Secondo fattore: solo app di autenticazione, un solo fattore per utente (D-01, D-04).
[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true

# Funzioni Edge del recupero (specs/002-accesso-protetto-2fa/contracts/edge-functions.md).
# Segreti (mai qui): RECOVERY_PEPPER, AVVISO_SMTP_*, ORIGINI_CONSENTITE, vedi supabase/README.md.
[functions.recovery-codes]
verify_jwt = true

[functions.recovery-code]
verify_jwt = true

[functions.recovery-phrase]
verify_jwt = true
