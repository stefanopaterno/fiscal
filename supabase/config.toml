# Configurazione Supabase di My Fiscal (vedi specs/002-accesso-protetto-2fa/research.md).
# Nessun segreto qui: il file è nel repository pubblico.
project_id = "my-fiscal"

[api]
enabled = true
schemas = ["public"]            # lo schema "private" NON è esposto dall'API
extra_search_path = ["extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
# TODO(ACCESSO_APP): sostituire con l'indirizzo reale del sito prima di applicare al progetto remoto.
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 900                         # 15 minuti (D-09)
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false                    # un solo utente: nessuna registrazione (D-05)
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits_symbols"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

# Secondo fattore: solo app di autenticazione, un solo fattore per utente (D-01, D-04).
[auth.mfa]
max_enrolled_factors = 1

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.mfa.web_authn]
enroll_enabled = false
verify_enabled = false

[storage]
enabled = true

# Le funzioni Edge arrivano nella fase di implementazione (specs/002.../contracts/edge-functions.md).
