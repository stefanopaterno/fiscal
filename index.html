<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soarlyar project</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Ctext x='32' y='44' font-size='36' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%23d4af37'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --gold-1: #f6e27a; --gold-2: #d4af37; --gold-3: #a67c00; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; }
  main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
  h1 { margin: 0; text-align: center; font-family: "Orbitron", "Eurostile", "Bank Gothic", "Segoe UI", system-ui, sans-serif;
    font-weight: 700; text-transform: uppercase; letter-spacing: .22em; line-height: 1.25;
    font-size: clamp(1.6rem, 7vw, 3.4rem); padding-left: .22em;
    background: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 50%, var(--gold-3) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px rgba(212, 175, 55, .35)); }
  h1 span { display: block; font-weight: 500; font-size: .42em; letter-spacing: .5em; margin-top: .6em; padding-left: .5em; }
</style>
</head>

<main>
  <h1>Soarlyar<span>project</span></h1>
</main>
